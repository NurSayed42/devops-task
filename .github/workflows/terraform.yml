name: Terraform

# Static checks only: nothing here talks to AWS. Plans/applies are run by an
# operator (see README) because the infra is short-lived for this task.
on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/deploy.sh" # embedded in the EC2 user data
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt, validate & tflint (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, shared, app]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      # Plan-only tests with a mocked AWS provider (tests/*.tftest.hcl): no AWS
      # account or credentials, yet the whole plan is evaluated and asserted on.
      - name: terraform test (mocked AWS provider)
        run: terraform test -no-color

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids API rate limits when fetching the AWS ruleset
        run: |
          tflint --init --config ../.tflint.hcl
          tflint --config ../.tflint.hcl --format compact

  iac-scan:
    name: Trivy misconfiguration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          version: v0.76.2
          severity: HIGH,CRITICAL
          format: table
          output: trivy-iac.txt
          exit-code: "1"

      - name: Publish findings to job summary
        if: always()
        run: |
          {
            echo "### Trivy IaC scan (HIGH + CRITICAL)"
            echo '```'
            cat trivy-iac.txt 2>/dev/null || echo "No report produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface each finding as an annotation on the offending file and line
          # (the table prints "ID (SEVERITY): title" followed by " path.tf:start-end").
          [ -f trivy-iac.txt ] || exit 0
          awk '
            /^(AVD-)?[A-Z]+-[0-9]+ \((LOW|MEDIUM|HIGH|CRITICAL)\):/ { finding = $0; next }
            finding != "" && match($0, /^ *[^ ]+\.tf:[0-9]+/) {
              loc = substr($0, RSTART, RLENGTH); gsub(/ /, "", loc)
              split(loc, part, ":")
              printf "::warning file=terraform/%s,line=%s,title=Trivy IaC::%s (%s)\n", part[1], part[2], finding, loc
              finding = ""
            }
          ' trivy-iac.txt
