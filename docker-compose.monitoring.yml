# Observability stack. Included by docker-compose.yml, so
#   docker compose up -d       -> app + everything below
#   docker compose up -d app   -> the app only
#
# Network exposure: only Grafana publishes a port, and only on 127.0.0.1. All
# other components talk over the "monitoring" network, which is `internal`
# (no route to the outside world, nothing reachable from the host).

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # The only container that touches the Docker socket. It exposes a read-only
  # subset of the Docker API (list/inspect containers, read their logs, /info)
  # to Alloy and cAdvisor; POST/DELETE, exec, images, volumes... are refused.
  # Mounting the socket itself into Alloy/cAdvisor would be root-equivalent.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    <<: *common
    environment: # GET only (POST stays 0): read, never change
      CONTAINERS: 1 # list/inspect containers, read their logs
      NETWORKS: 1 # Alloy's Docker discovery reads network metadata
      INFO: 1 # cAdvisor reads /info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 64M }

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    <<: *common
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever limit is hit first wins: 15 days of history, at most 1 GB on disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # Host metrics. Reads the host's /proc, /sys and filesystems through a
  # read-only bind of / (--path.rootfs); pid: host lets it see host processes.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    <<: *common
    command:
      - --path.rootfs=/host
      # Only real disks: drop pseudo filesystems (node_exporter's default list
      # + tmpfs, and 9p = host-folder shares) and Docker/WSL plumbing mounts.
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|9p)$$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+|parent-distro|mnt/host)($$|/)
    pid: host
    volumes:
      # On a Linux server add ",rslave" so filesystems mounted later show up;
      # Docker Desktop's VM root is not a shared mount and rejects it.
      - /:/host:ro
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  # Per-container metrics from cgroups; container names come from the Docker
  # API through the proxy.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0@sha256:448ca9b1ce0d3f2eb7563938030908a4b81ddfe959a3fe5e62f691fd4b2cb417
    <<: *common
    command:
      - --docker=tcp://docker-proxy:2375
      - --docker_only=true
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,network,diskIO,oom_event
      # Keep label cardinality down: only the compose labels we query on.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    read_only: true
    depends_on: [docker-proxy]
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    <<: *common
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    read_only: true
    # Distroless image (no shell, no wget): liveness is watched by Prometheus
    # scraping /metrics instead of a Docker healthcheck.
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # Log collector: discovers containers through the proxy, tails their logs,
  # parses the app's JSON and pushes to Loki.
  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    <<: *common
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    user: "473:473" # the image's "alloy" user; it defaults to root, which it doesn't need
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data # read positions survive restarts
    read_only: true
    depends_on: [docker-proxy, loki]
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    <<: *common
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/alertmanager:/etc/alertmanager/secrets:ro # only its own secret
      - alertmanager-data:/alertmanager
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    # "alert-egress": the only component that needs the internet (Discord).
    networks: [monitoring, alert-egress]
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 64M }

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    <<: *common
    ports:
      - "127.0.0.1:3000:3000" # the stack's only published port, loopback only
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Read from a Docker secret (a file), so the password is not in the
      # container's environment / `docker inspect`.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/application.json
    secrets: [grafana_admin_password]
    # Fail closed. If the secret can't be read, Grafana's own entrypoint only
    # prints a warning and initialises the admin account as admin/admin. And
    # when the source file is missing, Docker creates an empty *directory* in
    # its place and mounts that. Both were found while testing this setup, so:
    # start only if the secret is a regular, non-empty file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        f=/run/secrets/grafana_admin_password
        if [ ! -f "$$f" ] || [ ! -s "$$f" ]; then
          echo "FATAL: secret grafana_admin_password is missing, empty or not a file (see secrets/README.md)" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    # "monitoring" to reach the data sources; "grafana-ui" because a port can
    # only be published from a non-internal network.
    networks: [monitoring, grafana-ui]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }

networks:
  monitoring:
    name: monitoring
    internal: true
  grafana-ui:
    name: grafana-ui
  alert-egress:
    name: alert-egress

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  alertmanager-data:

secrets:
  # A git-ignored file (see secrets/README.md). Compose refuses to start Grafana
  # if it is missing, so there is never a default password. (A file, not an
  # environment-sourced secret: Compose only supports file secrets for
  # read_only services.)
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
