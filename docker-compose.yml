name: devops-task

# Monitoring/logging stack (Prometheus, Grafana, Loki, Alloy, Node Exporter,
# cAdvisor). `docker compose up -d app` starts the app on its own.
include:
  - docker-compose.monitoring.yml

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: devops-task-api:${APP_VERSION:-0.1.0}
    container_name: devops-task-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - app-net
      # Lets Prometheus scrape /metrics over the internal network.
      - monitoring

networks:
  app-net:
    name: app-net
