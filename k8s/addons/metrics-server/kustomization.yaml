# metrics-server feeds CPU/memory usage to the HorizontalPodAutoscaler.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
patches:
  # kind's kubelets use self-signed serving certificates. Local cluster only:
  # on EKS the kubelet certificates are valid and this flag must not be used.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
