apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task-api
  minReplicas: 2 # never a single point of failure
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # % of the 100m CPU request
  behavior:
    # Scale up quickly, scale down slowly: avoids flapping when load is bursty.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
