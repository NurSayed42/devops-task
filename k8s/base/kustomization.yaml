apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-task

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-task
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Non-sensitive configuration. The generated name carries a content hash, so a
# config change rolls the Deployment automatically (no stale pods).
# APP_VERSION is deliberately absent: it is baked into the image at build time.
configMapGenerator:
  - name: devops-task-api-config
    literals:
      - PORT=8080
      - LOG_LEVEL=INFO
      - APP_ENV=kubernetes
