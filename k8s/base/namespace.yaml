apiVersion: v1
kind: Namespace
metadata:
  name: devops-task
  labels:
    # Pod Security Admission: the API server rejects any pod in this namespace
    # that runs as root, escalates privileges, adds capabilities, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
