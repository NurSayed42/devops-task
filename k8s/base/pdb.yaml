# Voluntary disruptions (node drain, cluster upgrade) may take down at most
# one pod at a time, so the service always keeps a ready replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-task-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task-api
