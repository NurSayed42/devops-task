# Local kind cluster: kubectl apply -k k8s/overlays/kind
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Also set here: objects generated by this overlay (the Secret) would otherwise
# land in "default", and kustomize would not rewrite the hashed name into the
# Deployment (name references only match within a namespace).
namespace: devops-task

resources:
  - ../../base

# The image is built locally and side-loaded with `kind load docker-image`.
# A release changes only this tag (kustomize edit set image ...).
images:
  - name: devops-task-api
    newName: devops-task-api
    newTag: "0.1.0"

configMapGenerator:
  - name: devops-task-api-config
    behavior: merge
    literals:
      - APP_ENV=kind

# Built from a git-ignored file (copy secrets.env.example). No secret value is
# ever committed; see docs/kubernetes.md for how production does it instead.
secretGenerator:
  - name: devops-task-api-secrets
    envs:
      - secrets.env
