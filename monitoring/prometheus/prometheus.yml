global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  # The application's own /metrics (request count, errors, latency histogram).
  - job_name: app
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: devops-task-api

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # The monitoring stack watches itself, so a dead component is noticed.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
